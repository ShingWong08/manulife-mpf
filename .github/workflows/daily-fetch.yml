name: Daily Fetch Manulife MPF Funds Data

on:
  schedule:
    # 每天週一至週五 UTC 14:00 執行（相當於香港時間 HKT 22:00，強積金每日收盤公佈淨值後）
    - cron: '0 14 * * 1-5'
  # 支援在 GitHub Actions 頁面手動點擊「Run workflow」按鈕測試與立即抓取
  workflow_dispatch:

# 授予 GitHub Action 推送更新回本倉庫的寫入權限
permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetch Script
        run: |
          python fetch_funds.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "數據無變動，跳過提交。"
          else
            echo "檢測到數據更新，正在提交並推送到 GitHub..."
            git commit -m "chore(data): auto-update Manulife MPF fund prices [$(date +'%Y-%m-%d')]"
            git push
          fi
