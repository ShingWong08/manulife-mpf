name: Daily Fetch Manulife MPF Funds Data

on:
  schedule:
    # 每天週一至週五 UTC 14:00 執行（相當於香港時間 HKT 22:00，強積金每日收盤公佈淨值後）
    - cron: '0 14 * * 1-5'
  # 支援在 GitHub Actions 頁面手動點擊「Run workflow」按鈕測試與立即抓取
  workflow_dispatch:

# 授予 GitHub Action 推送更新與發佈 Release 的寫入權限
permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetch Script
        run: |
          python fetch_funds.py

      - name: Commit and Push Changes to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "數據無變動，跳過提交。"
          else
            echo "檢測到數據更新，正在提交並推送到 GitHub..."
            git commit -m "chore(data): auto-update Manulife MPF fund prices [$(date +'%Y-%m-%d')]"
            git push
          fi

      - name: Package Release Assets (Exact 32 files)
        run: |
          # 1. 建立打包暫存目錄，將全部 31 個 CSV 收集並打包為單一 ZIP
          mkdir -p package_temp
          cp data/manulife_mpf_funds_summary.csv package_temp/
          cp data/manulife_mpf_funds_details.csv package_temp/
          cp data/history/*.csv package_temp/

          # 打包為 manulife_mpf_all_files.zip (包含全部 31 個 CSV)
          (cd package_temp && zip -r ../manulife_mpf_all_files.zip .)
          rm -rf package_temp

          # 檢查檔案數量
          HISTORY_COUNT=$(ls -1 data/history/*.csv | wc -l)
          echo "歷史 CSV 數量: $HISTORY_COUNT"
          echo "包含 ZIP 總共將上傳: $((HISTORY_COUNT + 3)) 個檔案"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_STR="$(date +'%Y-%m-%d')"
          TAG_NAME="v$(date +'%Y.%m.%d')"
          RELEASE_TITLE="Manulife MPF Funds Data (${DATE_STR})"

          RELEASE_BODY=$(cat <<EOF
          ### 📊 宏利環球精選(強積金)計劃 每日數據自動匯出 (${DATE_STR})

          本 Release 共包含 **32 個檔案**：

          1. 📄 **manulife_mpf_funds_summary.csv**：全計劃 29 檔基金當日總匯總表（包含基金代號、名稱、幣別、資產類別、NAV、截至日期、每日變動價格/百分比、每月利率、風險級別、各期回報率等）
          2. 📄 **manulife_mpf_funds_details.csv**：29 檔基金投資檔案總表（包含發行日期、發行價、投資目標、管理費等）
          3. 📦 **manulife_mpf_all_files.zip**：一鍵下載全部 31 個 CSV 的壓縮檔
          4. 📈 **29 檔個別基金歷史價格走勢 CSV**：
             - 保證類：\`DHK121.csv\`, \`SHK122.csv\`
             - 混合資產類：\`SHK123.csv\`, \`SHK124.csv\`, \`SHK134.csv\`, \`SHK135.csv\`, \`SHK138.csv\`, \`SHK140.csv\`, \`SHK141.csv\`, \`SHK142.csv\`, \`SHK143.csv\`, \`SHK144.csv\`, \`SHK148.csv\`, \`SHK149.csv\`, \`SHK150.csv\`
             - 貨幣市場類：\`SHK125.csv\`
             - 股票類：\`SHK126.csv\`, \`SHK127.csv\`, \`SHK128.csv\`, \`SHK129.csv\`, \`SHK130.csv\`, \`SHK131.csv\`, \`SHK136.csv\`, \`SHK137.csv\`, \`SHK145.csv\`
             - 債券類：\`SHK132.csv\`, \`SHK133.csv\`, \`SHK146.csv\`, \`SHK147.csv\`

          _由 GitHub Actions 自動定時排程生成於 ${DATE_STR}_
          EOF
          )

          # 建立要上傳的 32 個資產清單
          ASSETS=(
            "data/manulife_mpf_funds_summary.csv"
            "data/manulife_mpf_funds_details.csv"
            "manulife_mpf_all_files.zip"
          )

          # 加入全部 29 個基金歷史 CSV
          for f in data/history/*.csv; do
            [ -e "$f" ] && ASSETS+=("$f")
          done

          echo "上傳檔案清單總數: ${#ASSETS[@]}"

          # 檢查當天 Release 是否已存在
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "當天 Release ($TAG_NAME) 已存在，正在更新資產與說明..."
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "$RELEASE_BODY"
          else
            echo "正在建立新 Release: $TAG_NAME ..."
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_BODY"
          fi
          echo "GitHub Release (共 ${#ASSETS[@]} 個檔案) 發佈完成！"
