name: Daily Fetch Manulife MPF Funds Data

on:
  schedule:
    # 週二至週六 UTC 00:30 執行（相當於香港時間 HKT 週二至週六早上 08:30，即週一至週五交易日隔天早上）
    - cron: '30 0 * * 2-6'
  # 支援在 GitHub Actions 頁面手動點擊「Run workflow」按鈕測試與立即抓取
  workflow_dispatch:

# 授予 GitHub Action 推送更新與發佈 Release 的寫入權限
permissions:
  contents: write

env:
  TZ: Asia/Hong_Kong

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure Chrome Browser is Ready
        run: |
          if command -v google-chrome &> /dev/null; then
            echo "Google Chrome 已預裝: $(google-chrome --version)"
          elif command -v chromium-browser &> /dev/null; then
            echo "Chromium 已預裝: $(chromium-browser --version)"
          else
            echo "正在安裝 Google Chrome..."
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi

      - name: Run Fetch Script (Using Chrome Engine)
        run: |
          python fetch_funds.py

      - name: Commit and Push Changes to Repository
        id: check_changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A data/
          if git diff --staged --quiet; then
            echo "數據無變動，跳過提交與 Release 發佈。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "檢測到數據更新，正在提交並推送到 GitHub..."
            git commit -m "chore(data): auto-update Manulife MPF fund prices [$(date +'%Y-%m-%d')]"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Release Assets (Exact 32 files in Traditional Chinese)
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # 建立打包暫存目錄，將全部 31 個繁體中文 CSV 收集並打包為單一 ZIP
          mkdir -p package_temp
          cp "data/宏利強積金基金當日總覽.csv" package_temp/
          cp "data/宏利強積金基金投資檔案.csv" package_temp/
          cp data/history/*.csv package_temp/

          # 打包為 宏利強積金全部檔案.zip (內含全部 31 個純繁體中文檔名 CSV)
          rm -f "宏利強積金全部檔案.zip"
          (cd package_temp && zip -r "../宏利強積金全部檔案.zip" .)
          rm -rf package_temp

          # 檢查檔案數量
          HISTORY_COUNT=$(ls -1 data/history/*.csv | wc -l)
          echo "歷史 CSV 數量: $HISTORY_COUNT"
          echo "包含 ZIP 總共將上傳: $((HISTORY_COUNT + 3)) 個檔案"

      - name: Create or Update GitHub Release
        if: steps.check_changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_STR="$(date +'%Y-%m-%d')"
          TAG_NAME="v$(date +'%Y.%m.%d')"
          RELEASE_TITLE="宏利強積金基金數據 (${DATE_STR})"

          RELEASE_BODY=$(cat <<EOF
          ### 📊 宏利環球精選(強積金)計劃 每日數據自動匯出 (${DATE_STR})

          本發佈版本共包含 **32 個純繁體中文檔案**：

          1. 📄 **宏利強積金基金當日總覽.csv**：全計劃 29 檔基金當日總匯總表（包含基金代號、名稱、幣別、資產類別、單位資產淨值、截至日期、每日變動價格/百分比、每月公佈利率、風險級別、各期回報率等）
          2. 📄 **宏利強積金基金投資檔案.csv**：29 檔基金投資檔案總表（包含發行日期、發行價、投資目標說明、管理費等）
          3. 📦 **宏利強積金全部檔案.zip**：一鍵下載全部 31 個繁體中文 CSV 的壓縮檔
          4. 📈 **29 檔個別成份基金歷史價格走勢 CSV**：
             - **保證類**：\`宏利強積金利息基金.csv\`、\`宏利強積金穩健基金.csv\`
             - **混合資產類**：\`宏利強積金增長基金.csv\`、\`宏利強積金進取基金.csv\`、\`宏利強積金富達增長基金.csv\`、\`宏利強積金富達平穩增長基金.csv\`、\`宏利強積金智優裕退休基金.csv\`、\`宏利強積金2025退休基金.csv\`、\`宏利強積金2030退休基金.csv\`、\`宏利強積金2035退休基金.csv\`、\`宏利強積金2040退休基金.csv\`、\`宏利強積金2045退休基金.csv\`、\`宏利強積金核心累積基金.csv\`、\`宏利強積金65歲後基金.csv\`、\`宏利強積金退休收益基金.csv\`
             - **貨幣市場類**：\`宏利強積金保守基金.csv\`
             - **股票類**：\`宏利強積金香港股票基金.csv\`、\`宏利強積金國際股票基金.csv\`、\`宏利強積金亞太股票基金.csv\`、\`宏利強積金歐洲股票基金.csv\`、\`宏利強積金北美股票基金.csv\`、\`宏利強積金日本股票基金.csv\`、\`宏利強積金中華威力基金.csv\`、\`宏利強積金康健護理基金.csv\`、\`宏利強積金恒指環境社會及管治基金.csv\`
             - **債券類**：\`宏利強積金香港債券基金.csv\`、\`宏利強積金國際債券基金.csv\`、\`宏利強積金可持續亞太債券基金.csv\`、\`宏利強積金人民幣債券基金.csv\`

          _由系統自動定時排程生成於 ${DATE_STR}_
          EOF
          )

          # GitHub Release 底層上傳 API 僅接受 ASCII 實體檔名，但支援透過「實體路徑#繁體中文顯示名稱」設定頁面上顯示的純中文檔案名稱。
          # 這裡使用純數字編號作為底層實體檔名，並綁定純繁體中文顯示名稱（完全無英文字母）。
          rm -rf release_stage
          mkdir -p release_stage

          ASSETS=()

          cp "宏利強積金全部檔案.zip" "release_stage/00.zip"
          ASSETS+=("release_stage/00.zip#宏利強積金全部檔案.zip")

          cp "data/宏利強積金基金當日總覽.csv" "release_stage/01.csv"
          ASSETS+=("release_stage/01.csv#宏利強積金基金當日總覽.csv")

          cp "data/宏利強積金基金投資檔案.csv" "release_stage/02.csv"
          ASSETS+=("release_stage/02.csv#宏利強積金基金投資檔案.csv")

          IDX=3
          for f in data/history/*.csv; do
            [ -e "$f" ] || continue
            BASENAME="$(basename "$f")"
            STAGE_FILE=$(printf "release_stage/%02d.csv" "$IDX")
            cp "$f" "$STAGE_FILE"
            ASSETS+=("${STAGE_FILE}#${BASENAME}")
            IDX=$((IDX + 1))
          done

          echo "上傳檔案清單總數: ${#ASSETS[@]}"

          # 若當天 Release 已存在（例如含舊版英文檔名資產），先刪除再重建，確保頁面上只保留純繁體中文檔案名稱
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "當天 Release ($TAG_NAME) 已存在，正在移除舊資產並重新發佈純繁體中文清單..."
            gh release delete "$TAG_NAME" --yes
          fi

          echo "正在建立 Release: $TAG_NAME ..."
          gh release create "$TAG_NAME" "${ASSETS[@]}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_BODY"

          rm -rf release_stage
          echo "GitHub Release (共 ${#ASSETS[@]} 個純繁體中文檔案) 發佈完成！"